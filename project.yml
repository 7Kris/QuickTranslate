name: QuickTranslate
options:
  bundleIdPrefix: net.kenmaz
  deploymentTarget:
    macOS: "26.0"

targets:
  QuickTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: SupportingFiles/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kenmaz.QuickTranslate
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/QuickTranslate.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - script: |
          set -e
          # archive 時は配布物作成中なので /Applications/ への上書きをスキップ。
          # Xcode は archive のビルドフェーズに ACTION=install を渡す (archive ではない) ので両方見る。
          # install 時の BUILT_PRODUCTS_DIR にあるのは DSTROOT へのシンボリックリンクなので、
          # ここで cp すると /Applications/ に壊れたリンクが残ってしまう。
          case "$ACTION" in archive|install) exit 0 ;; esac
          # 一旦別名でコピーしてから差し替える。cp が途中で失敗しても既存アプリを壊さない。
          # cp -R は既存ディレクトリにマージするので、置き換えには rm が必要
          # (壊れたシンボリックリンクが残っている場合も cp は `Not a directory` で失敗する)。
          DEST="/Applications/$PRODUCT_NAME.app"
          STAGING="$DEST.new"
          rm -rf "$STAGING"
          cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$STAGING"
          rm -rf "$DEST"
          mv "$STAGING" "$DEST"
          echo "✅ $DEST にインストールしました"
        name: Install to /Applications
        basedOnDependencyAnalysis: false
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: QuickTranslate
        CFBundleDisplayName: QuickTranslate
        CFBundleIdentifier: net.kenmaz.QuickTranslate
        CFBundleVersion: "4"
        CFBundleShortVersionString: "1.3.0"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 kenmaz"
