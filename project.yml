name: QuickTranslate
options:
  bundleIdPrefix: net.kenmaz
  deploymentTarget:
    macOS: "13.0"

targets:
  QuickTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kenmaz.QuickTranslate
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/QuickTranslate.entitlements
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      - script: |
          cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" /Applications/
          echo "✅ /Applications/$PRODUCT_NAME.app にインストールしました"
        name: Install to /Applications
        basedOnDependencyAnalysis: false
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: QuickTranslate
        CFBundleDisplayName: QuickTranslate
        CFBundleIdentifier: net.kenmaz.QuickTranslate
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 kenmaz"
