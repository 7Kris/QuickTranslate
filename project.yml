name: QuickTranslate
options:
  bundleIdPrefix: net.kenmaz
  deploymentTarget:
    macOS: "26.0"

targets:
  QuickTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: SupportingFiles/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kenmaz.QuickTranslate
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/QuickTranslate.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - script: |
          set -e
          # archive 時は配布物作成中なので /Applications/ への上書きをスキップ。
          # Xcode は archive のビルドフェーズに ACTION=install を渡す (archive ではない) ので両方見る。
          # install 時の BUILT_PRODUCTS_DIR にあるのは DSTROOT へのシンボリックリンクなので、
          # ここで cp すると /Applications/ に壊れたリンクが残ってしまう。
          case "$ACTION" in archive|install) exit 0 ;; esac
          # 一旦別名でコピーしてから差し替える。cp が途中で失敗しても既存アプリを壊さない。
          # cp -R は既存ディレクトリにマージするので、置き換えには mv/rm が必要
          # (壊れたシンボリックリンクが残っている場合も cp は `Not a directory` で失敗する)。
          DEST="/Applications/$PRODUCT_NAME.app"
          # 作業用は隠しディレクトリに置く。/Applications 直下に .app を晒すと
          # LaunchServices/Spotlight が別アプリとして拾ってしまう。
          STAGE_DIR="/Applications/.$PRODUCT_NAME-install"
          STAGING="$STAGE_DIR/$PRODUCT_NAME.app"
          BACKUP="$STAGE_DIR/$PRODUCT_NAME.app.old"
          LOCK="/Applications/.$PRODUCT_NAME-install.lock"

          # 同じプロジェクトを同時にビルドすると、退避と rename が交差して
          # .app の中に .app が入れ子でコピーされる (署名が壊れるのに成功扱いになる)。
          # mkdir は atomic なのでこれをロックに使う。
          # 前のビルドが SIGKILL 等で残したロックは、PID が生きていなければ奪う。
          if ! mkdir "$LOCK" 2>/dev/null; then
            OWNER=$(cat "$LOCK/pid" 2>/dev/null || true)
            if [ -n "$OWNER" ] && kill -0 "$OWNER" 2>/dev/null; then
              echo "warning: 別のビルドが $DEST を更新中のためスキップします"
              exit 0
            fi
            rm -rf "$LOCK"
            if ! mkdir "$LOCK" 2>/dev/null; then
              echo "warning: 別のビルドが $DEST を更新中のためスキップします"
              exit 0
            fi
          fi
          echo $$ > "$LOCK/pid"

          # 中断・失敗しても中途半端なコピーを残さず、アプリが消えた状態にもしない。
          # SIGKILL 等でトラップごと飛ばされた場合も、次回ビルド冒頭の cleanup で復旧する。
          # ロック解放は cleanup に含めない。起動時の自己修復で自分のロックを外してしまう。
          cleanup() {
            if [ ! -e "$DEST" ] && { [ -e "$BACKUP" ] || [ -L "$BACKUP" ]; }; then
              mv "$BACKUP" "$DEST"
            fi
            rm -rf "$STAGE_DIR"
          }
          trap 'cleanup; rm -rf "$LOCK"' EXIT
          trap 'exit 1' INT TERM
          cleanup
          mkdir -p "$STAGE_DIR"
          cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$STAGING"
          # 差し替えは rename で行う。rm -rf "$DEST" してから cp すると、
          # コピーにかかる間アプリが存在しない状態が続く。
          if [ -e "$DEST" ] || [ -L "$DEST" ]; then
            mv "$DEST" "$BACKUP"
          fi
          # ロックの外にいるプロセス (Finder でのコピー等) が作った場合に備える
          rm -rf "$DEST"
          mv "$STAGING" "$DEST"
          # ロックの外から $DEST を作られると mv が入れ子コピーになる。
          # sh からは rename の入れ替えが使えないので、黙って壊れる代わりに落とす。
          if [ -e "$DEST/$PRODUCT_NAME.app" ]; then
            echo "error: $DEST が別プロセスに作り直されたため入れ子コピーになりました。もう一度ビルドしてください" >&2
            exit 1
          fi
          echo "✅ $DEST にインストールしました"
        name: Install to /Applications
        basedOnDependencyAnalysis: false
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: QuickTranslate
        CFBundleDisplayName: QuickTranslate
        CFBundleIdentifier: net.kenmaz.QuickTranslate
        CFBundleVersion: "4"
        CFBundleShortVersionString: "1.3.0"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 kenmaz"
